{{bookingForm.pristine | json}}
{{bookingForm.dirty | json}}
<div class="booking_form_container">
  <div>
    <button mat-raised-button color="primary" type="button" (click)="addPassport()">Add Passport</button>
  </div>
  <div>
    <button mat-raised-button color="primary" type="button" (click)="deletePassport()">
      delete Passport
    </button>
  </div>
  <form [formGroup]="bookingForm" class="example-form" (ngSubmit)="addBooking()">
    <mat-form-field *ngIf="bookingForm.get('passport')">
      <mat-label>Passport</mat-label>
      <input type="text" matInput formControlName="passport" placeholder="Passport Number" />
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>RoomId</mat-label>
      <input type="text" matInput formControlName="roomId" placeholder='roomId' />
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Guest Name</mat-label>
      <input type="text" matInput formControlName="guestName" placeholder='Guest Name' />
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Guest Email</mat-label>
      <input type="text" matInput formControlName="guestEmail" placeholder='Guest Email' />
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Mobile Number</mat-label>
      <input type="text" matInput formControlName="mobileNumber" placeholder='Mobile Number' />
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Booking Amount</mat-label>
      <input type="text" matInput formControlName="bookingAmount" placeholder='Booking Amount' />
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Checkin Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="checkinDate" />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Checkout Date</mat-label>
      <input matInput [matDatepicker]="checkout" formControlName="checkoutDate" />
      <mat-datepicker-toggle matSuffix [for]="checkout"></mat-datepicker-toggle>
      <mat-datepicker #checkout></mat-datepicker>
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Booking Date</mat-label>
      <input matInput [matDatepicker]="booking" formControlName="bookingDate" />
      <mat-datepicker-toggle matSuffix [for]="booking"></mat-datepicker-toggle>
      <mat-datepicker #booking></mat-datepicker>
    </mat-form-field>

    <div formGroupName="address">
      <mat-accordion class="example-headers-align" multi>
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              Address
            </mat-panel-title>
          </mat-expansion-panel-header>

          <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>Address Line1</mat-label>
            <input type="text" matInput formControlName="addressLine1" placeholder='AddressLine1' />
          </mat-form-field>

          <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>Address Line2</mat-label>
            <input type="text" matInput formControlName="addressLine2" placeholder='AddressLine2' />
          </mat-form-field>

          <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>City</mat-label>
            <input type="text" matInput formControlName="city" placeholder='city' />
          </mat-form-field>

          <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>State</mat-label>
            <input type="text" matInput formControlName="state" placeholder='State' />
          </mat-form-field>

          <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>Country</mat-label>
            <input type="text" matInput formControlName="country" placeholder='Country' />
          </mat-form-field>

          <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>ZipCode</mat-label>
            <input type="text" matInput formControlName="zipCode" placeholder='ZipCode' />
          </mat-form-field>
        </mat-expansion-panel>
      </mat-accordion>
    </div>
    <div>
      <button mat-raised-button color="primary" type="button" (click)="addGuest()">Add Guest</button>
    </div>
    <div formArrayName="guests">
      <mat-accordion class="example-headers-align" multi>
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              Guest
            </mat-panel-title>
          </mat-expansion-panel-header>
          <div *ngFor="let guest of guests.controls; let i = index">
            <div [formGroupName]="i">
              <mat-form-field>
                <input type="text" matInput formControlName="guestName" placeholder="Guest Name">
              </mat-form-field>
              <mat-form-field>
                <input type="number" matInput formControlName="age" placeholder="Age">
              </mat-form-field>
            </div>
            <div>
              <button mat-raised-button color="primary" type="button" (click)="removeGuest(i)">
                Remove Guest
              </button>
            </div>
          </div>
        </mat-expansion-panel>
      </mat-accordion>

    </div>
    <div>
      <mat-checkbox class="example-margin" formControlName="tnc"
        >TnC</mat-checkbox
      >
    </div>
    <div>
      <button mat-raised-button color="primary" [disabled]="bookingForm.invalid" >Book Room</button>
    </div>
  </form>
</div>
